<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Daily Expense Tracker Pro</title>
    <meta name="description" content="Smart Daily Money Management developed by Vishwajit Jadhav. Track income, expenses, and net balance with multi-currency support." />
    
    <!-- PWA & Android Meta Tags -->
    <meta name="theme-color" content="#0B0F19" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ExpensePro" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Open Graph -->
    <meta property="og:title" content="Daily Expense Tracker Pro" />
    <meta property="og:description" content="Smart Daily Money Management developed by Vishwajit Jadhav" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon.svg" />
  </head>
  <body class="bg-[#0B0F19] text-slate-100 antialiased selection:bg-indigo-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration skipped:', err);
          });
        });
      }
    </script>
  </body>
</html>
